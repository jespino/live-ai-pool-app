version: '3.8'

services:
  devcontainer:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - go-cache:/go
      - node-modules:/workspace/frontend/node_modules
    command: sleep infinity
    environment:
      - PORT=8081
      - DB_TYPE=memory
      - GO111MODULE=on
      - GOPATH=/go

volumes:
  go-cache:
  node-modules: