# defines automation services (optional)
services:
  frontend:
    name: Frontend Dev Server
    description: React frontend development server
    triggeredBy:
      - postEnvironmentStart
    commands:
      start: npm run dev
      ready: curl -s http://localhost:5173 > /dev/null

# defines automation tasks (optional)
tasks:
  dependencies:
    name: Install Dependencies
    description: Install npm dependencies
    triggeredBy:
      - postEnvironmentStart
    command: npm install
  
  lint:
    name: Lint Code
    description: Run ESLint
    triggeredBy:
      - manual
    dependsOn:
      - dependencies
    command: npm run lint
  
  typecheck:
    name: Type Check
    description: Run TypeScript type checking
    triggeredBy:
      - manual
    dependsOn:
      - dependencies
    command: npm run typecheck